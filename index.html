<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI Orchestra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='4' y='4' width='92' height='92' rx='22' fill='%230b0e14'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%237dd3fc' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='11' fill='%2360a5fa'/%3E%3C/svg%3E">
<style>
  :root { --bg:#07090f; --panel:#111622; --fg:#e6edf7; --muted:#8b96ad; --line:#273149; --accent:#7dd3fc; --bad:#f87171; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: radial-gradient(700px 360px at 50% -10%, rgba(125,211,252,.16), transparent 55%), var(--bg);
    color: var(--fg); font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  .box {
    width: 380px; max-width: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px 26px 22px; text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  svg.mark { width: 56px; height: 56px; display: block; margin: 0 auto 12px; }
  h1 { margin: 0 0 4px; font-size: 18px; letter-spacing: 2px; color: var(--accent); }
  .sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  label { display: block; text-align: left; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 12px; font: inherit; text-align: center;
    color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 12px; width: 100%; padding: 11px; font: inherit; font-weight: 650;
    color: #071018; background: var(--accent); border: 0; border-radius: 9px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: var(--bad); }
  .hint { margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .pages { display: block; margin-top: 14px; color: var(--accent); font-size: 13px; }
</style>
</head>
<body>
<div class="box">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <rect x="4" y="4" width="92" height="92" rx="22" fill="#0b0e14"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#7dd3fc" stroke-width="4"/>
    <circle cx="50" cy="50" r="11" fill="#60a5fa"/>
    <circle cx="50" cy="20" r="6" fill="#34d399"/>
    <circle cx="78.5" cy="40.7" r="6" fill="#34d399"/>
    <circle cx="67.6" cy="74.3" r="6" fill="#34d399"/>
    <circle cx="32.4" cy="74.3" r="6" fill="#f87171"/>
    <circle cx="21.5" cy="40.7" r="6" fill="#34d399"/>
  </svg>
  <h1>AI ORCHESTRA</h1>
  <p class="sub">Download page and documentation.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off" autofocus>
  <button id="go">Enter</button>
  <div id="msg"></div>
  <p class="hint">Bookmark the page that opens and it will not ask again.</p>
  <a class="pages" href="https://hero-999-dev.github.io/ai-orchestra-web/">https://hero-999-dev.github.io/ai-orchestra-web/</a>
</div>
<script>
async function enter() {
  const msg = document.getElementById('msg');
  const go = document.getElementById('go');
  const pass = document.getElementById('pw').value.trim();
  if (!pass) { msg.textContent = 'Password is empty.'; return; }
  go.disabled = true;
  msg.style.color = 'var(--muted)';
  msg.textContent = 'Checking…';
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('orchestra:' + pass));
  const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  const dir = 'p-' + hex.slice(0, 20) + '/';
  let opened = false;
  try {
    const r = await fetch(dir + 'index.html', { cache: 'no-store' });
    const text = await r.text();
    opened = r.ok && text.includes('name="orchestra-page" content="download"');
  } catch (e) {}
  if (opened) { location.href = dir; return; }
  msg.style.color = 'var(--bad)';
  msg.textContent = 'Hatalı girdiniz, tekrar giriniz.';
  go.disabled = false;
  const pw = document.getElementById('pw');
  pw.focus();
  pw.select();
}
document.getElementById('go').addEventListener('click', enter);
document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') enter(); });
</script>
</body>
</html>
